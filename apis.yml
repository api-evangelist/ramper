aid: ramper
name: Ramper
description: >-
  Ramper is a Web3 embedded-wallet and social-login platform that lets DApps onboard
  users with familiar Web2 credentials (Email, Google, Facebook, Apple, Twitter) and
  instantly create non-custodial, self-custody wallets with no seed phrases, browser
  extensions, or downloads. Its Embedded Wallet SDK ships as first-party npm packages
  for web (@ramper-v2/core, @ramper-v2/multi, @ramper/ethereum, @ramper/near,
  @ramper/terra, @ramper/chiliz, @ramper/viction), React Native mobile, Unity, and
  Telegram Mini Apps, and is compatible with ethers.js across EVM chains plus NEAR,
  Solana, BNB Chain, Sei, and Viction. Ramper also provides an embeddable WalletView
  (balances, transfers, transaction signing, fiat on-ramp) and a fiat NFT Checkout SDK.
  Developers integrate via an App ID / App Secret issued from the Developer Dashboard.
